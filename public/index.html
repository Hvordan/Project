<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#191126" />
    <title>Таємні знаки Еквестрії</title>
    <link rel="icon" href="/art/sigil.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/socket.io/socket.io.js"></script>
    <script type="module" src="/main.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="bar-inner">
        <button class="brand" data-nav="play" aria-label="Еквестрія — грати">
          <img src="/art/sigil.svg" alt="" /><span>Еквестрія</span>
        </button>
        <nav aria-label="Головне меню">
          <button data-nav="play">Грати</button><button data-nav="decks">Колоди</button
          ><button data-nav="rules">Правила</button>
        </nav>
      </div>
    </header>
    <main id="app" tabindex="-1"></main>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <noscript>Для гри увімкни JavaScript у браузері.</noscript>
  </body>
</html>
